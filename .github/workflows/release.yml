name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Deliberately no `latest` here. This job runs on every master push,
          # including ones the release gate skips, so publishing :latest from it
          # made the tag track master HEAD rather than the newest release — and
          # briefly overwrote the previous release's image mid-run. The release
          # job is now the only writer of :latest. Master builds stay reachable
          # as :master and :sha-<sha>.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Authenticates the bitsocial-cli postinstall's GitHub releases API calls, which
          # 403'd on the shared runner IP's unauthenticated rate limit. See the Dockerfile.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm 11
        run: |
          npm install -g npm@11.17.0
          npm --version

      # `npm pack --dry-run` and `npm publish` both run prepack (tsc -p tsconfig.build.json),
      # which needs the dev dependencies. This job installed nothing, so the build ran
      # against a node_modules with no @types/node and failed on every global in start.ts.
      - name: Install dependencies
        run: npm ci

      # release-it derives the next version from the conventional commits since the last
      # tag, so nothing here reads a hand-edited version. It would bump for *any* commit
      # though, including a docs- or CI-only push, so gate it on there being something
      # worth cutting an image and an npm version for.
      - name: Check for releasable commits
        id: gate
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "$LAST_TAG" ]; then RANGE="HEAD"; else RANGE="$LAST_TAG..HEAD"; fi
          COUNT="$(git log --no-merges --format='%s' "$RANGE" \
            | grep -vE '^(docs|ci|style|test)(\([^)]*\))?!?:' \
            | grep -vE '^chore\(release\)' \
            | wc -l || true)"
          echo "Releasable commits since ${LAST_TAG:-<no tag>}: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Nothing releasable since $LAST_TAG; skipping the release."
          fi

      # Bumps package.json, regenerates CHANGELOG.md via the after:bump hook, commits
      # `chore(release): <version> [skip ci]`, tags and pushes. The [skip ci] marker and
      # GITHUB_TOKEN-authored pushes both keep this from re-triggering the workflow.
      - name: Cut release
        if: steps.gate.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release -- --ci

      - name: Resolve released version
        if: steps.gate.outputs.release == 'true'
        id: release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Released v$VERSION"

      - name: Resolve npm publish
        if: steps.gate.outputs.release == 'true'
        id: npm
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          if ! npm view "$PACKAGE_NAME" name >/dev/null 2>&1; then
            echo "::error::$PACKAGE_NAME does not exist on npm yet. Bootstrap it manually first, for example by backfilling historical 0.1.0 and 0.1.1 tarballs from matching release code, then configure npm trusted publishing for release.yml before cutting this release."
            exit 1
          fi

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION will be published."
          fi

      - name: Verify npm package contents
        if: steps.gate.outputs.release == 'true' && steps.npm.outputs.publish == 'true'
        run: npm pack --dry-run

      - name: Write GitHub release notes
        if: steps.gate.outputs.release == 'true'
        run: |
          mkdir -p .tmp
          node scripts/changelog-release-notes.mts "${{ steps.release.outputs.version }}" > .tmp/release-notes.md

      - name: Set up Docker Buildx
        if: steps.gate.outputs.release == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.gate.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        if: steps.gate.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.major_minor }}
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.major }}
            ghcr.io/${{ github.repository }}:latest

      - name: Publish npm package
        if: steps.gate.outputs.release == 'true' && steps.npm.outputs.publish == 'true'
        run: npm publish --access public

      - name: Create GitHub release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.release.outputs.sha }}" \
            --title "${{ steps.release.outputs.tag }}" \
            --notes-file .tmp/release-notes.md \
            --latest
