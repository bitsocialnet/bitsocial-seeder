services:
  bitsocial-seeder:
    image: ghcr.io/bitsocialnet/bitsocial-seeder:latest
    build:
      context: .
    container_name: bitsocial-seeder
    restart: unless-stopped
    # Hard backstop above the heap cap (native/buffer memory included).
    mem_limit: 2g
    network_mode: host
    environment:
      NODE_ENV: production
      # Cap the V8 heap: Node's default limit scales with host RAM (~4 GiB on
      # an 8 GiB host) and lazy GC lets a long-running seeder balloon toward it.
      NODE_OPTIONS: "--max-old-space-size=1024"
      PKC_RPC_URL: ws://127.0.0.1:9138
      KUBO_RPC_URL: http://127.0.0.1:50019/api/v0
      PUBSUB_KUBO_RPC_URL: http://127.0.0.1:50019/api/v0
      IPFS_GATEWAY_URL: http://127.0.0.1:6473
      SEEDER_DAEMON_DATA_PATH: /data/bitsocial
      SEEDER_DAEMON_LOG_PATH: /data/logs
      # Unset falls through to config.ts's default: both official directory folders, polled
      # so changes to either list are discovered without requiring another bitsocial-seeder
      # release. Set COMMUNITY_LIST_SOURCES=none on the host for a votes-only seeder, which
      # requires and starts no bitsocial daemon (the SEEDER_DAEMON_* settings go unused).
      COMMUNITY_LIST_SOURCES: "${COMMUNITY_LIST_SOURCES:-}"
      COMMUNITY_EXTRA_LIST_SOURCES: "${COMMUNITY_EXTRA_LIST_SOURCES:-}"
      SEEDER_STATE_PATH: /data/seederState.json
      SEEDER_DB_PATH: /data/seeder.db
      PIN_CONCURRENCY: "1"
      MAX_COMMUNITIES: "${MAX_COMMUNITIES:-}"
      VOTES_MANIFEST_SOURCES: "${VOTES_MANIFEST_SOURCES:-}"
      VOTES_CHAIN_RPC_URLS: "${VOTES_CHAIN_RPC_URLS:-}"
      VOTES_ETH_RPC_URLS: "${VOTES_ETH_RPC_URLS:-}"
      # Compose only passes host env vars that are declared here, so every documented
      # VOTES_* override must be forwarded explicitly (empty falls through to the default).
      VOTES_HTTP_ROUTER_URLS: "${VOTES_HTTP_ROUTER_URLS:-}"
      VOTES_LIBP2P_HOST: "${VOTES_LIBP2P_HOST:-}"
      VOTES_LIBP2P_TCP_PORT: "${VOTES_LIBP2P_TCP_PORT:-}"
      VOTES_LIBP2P_WS_PORT: "${VOTES_LIBP2P_WS_PORT:-}"
      VOTES_RECONCILE_INTERVAL_MS: "${VOTES_RECONCILE_INTERVAL_MS:-}"
      VOTES_FETCH_MAX_STREAMS: "${VOTES_FETCH_MAX_STREAMS:-}"
      VOTES_UPDATE_CONCURRENCY: "${VOTES_UPDATE_CONCURRENCY:-}"
      VOTES_PEER_KEY_PATH: /data/votes-peer.key
      VOTES_BLOCKSTORE_PATH: /data/votes-blockstore
      VOTES_DATASTORE_PATH: /data/votes-datastore
      VOTES_DATA_PATH: /data/votes-cache
    volumes:
      - bitsocial-seeder-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  bitsocial-seeder-data:
